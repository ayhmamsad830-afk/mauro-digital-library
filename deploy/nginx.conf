# Nginx server block for MAURO / مُعِين خيري. Adjust server_name, paths and PHP-FPM socket.
server {
    listen 80;
    server_name library.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name library.example.com;

    ssl_certificate     /etc/letsencrypt/live/library.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/library.example.com/privkey.pem;

    # ONLY public/ is web-accessible. app/, config/, storage/ (PDFs, pages, backups), .env stay outside.
    root /var/www/digital-library/public;
    index index.php;
    charset utf-8;
    server_tokens off;
    client_max_body_size 16m;          # PDF limit (10 MB) + form overhead; keep in sync with php.ini

    location ~ /\. { deny all; return 404; }
    location ~* \.(pdf|sql|env|log|ini|sh|bak|md|lock)$ { deny all; return 404; }

    location / {
        try_files $uri /index.php?$query_string;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTPS on;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_read_timeout 180s;     # "Process now" renders small books synchronously
    }
    # No other PHP file may execute.
    location ~ \.php$ { return 404; }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }
}
