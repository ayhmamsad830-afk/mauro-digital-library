; MAURO — local Windows development PHP settings (NOT for production).
;
; Loaded IN ADDITION to the global php.ini through PHP_INI_SCAN_DIR by
; bin/dev-php.ps1, so the system PHP configuration is never modified.
; Keep this directory free of other *.ini files: PHP loads every one of them.
;
; Why: PHP on Windows ships without a CA certificate bundle, so HTTPS requests
; from PHP (e.g. fetching Google's ID-token signing keys) fail with
; "SSL certificate problem: unable to get local issuer certificate" (curl 60)
; and Google Sign-In is refused. Certificate verification stays ON; this only
; tells PHP which trusted CA list to verify against (the one Git for Windows
; installs). Linux production hosts use the system CA store instead.

curl.cainfo="C:/Program Files/Git/mingw64/etc/ssl/certs/ca-bundle.crt"
openssl.cafile="C:/Program Files/Git/mingw64/etc/ssl/certs/ca-bundle.crt"
