# Apache 2.4 virtual host. Requires mod_rewrite, mod_headers, mod_ssl and PHP-FPM (proxy_fcgi) or mod_php.
<VirtualHost *:80>
    ServerName library.example.com
    Redirect permanent / https://library.example.com/
</VirtualHost>

<VirtualHost *:443>
    ServerName library.example.com
    DocumentRoot /var/www/digital-library/public

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/library.example.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/library.example.com/privkey.pem

    <Directory /var/www/digital-library/public>
        AllowOverride All
        Require all granted
        Options -Indexes -MultiViews
    </Directory>
    # Defence in depth: nothing else of the project is reachable.
    <Directory /var/www/digital-library>
        Require all denied
    </Directory>

    <FilesMatch "^index\.php$">
        SetHandler "proxy:unix:/run/php/php8.4-fpm.sock|fcgi://localhost"
    </FilesMatch>

    LimitRequestBody 16777216
    ServerSignature Off
    ErrorLog ${APACHE_LOG_DIR}/library-error.log
    CustomLog ${APACHE_LOG_DIR}/library-access.log combined
</VirtualHost>
