; Recommended PHP settings for the production pool / panel (PHP 8.4).
display_errors = Off
display_startup_errors = Off
log_errors = On
expose_php = Off
memory_limit = 256M
upload_max_filesize = 12M        ; ≥ PDF_MAX_UPLOAD_MB
post_max_size = 16M              ; > upload_max_filesize
max_execution_time = 120
max_input_time = 120
file_uploads = On
allow_url_fopen = On             ; Google JWKS fetch uses cURL; fopen only as fallback
session.use_strict_mode = 1
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = Lax
session.use_only_cookies = 1
opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 60
; proc_open must NOT be in disable_functions: server-side PDF rendering needs it.
